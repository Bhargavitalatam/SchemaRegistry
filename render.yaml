services:
  - type: web
    name: schema-registry-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: API_KEY
        generateValue: true
      - key: SEED_DIR
        value: /app/seeds
      - key: DATABASE_URL
        fromDatabase:
          name: schema-registry-db
          property: connectionString

  - type: pserv
    name: schema-registry-db
    env: postgres
    plan: free
    ipAllowList: []
