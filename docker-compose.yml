services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      POSTGRES_DB: ${POSTGRES_DB:-schema_registry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-registry} -d ${POSTGRES_DB:-schema_registry}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  api:
    build: ./backend
    environment:
      API_PORT: ${API_PORT:-3001}
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgres://${POSTGRES_USER:-registry}:${POSTGRES_PASSWORD:-registry}@db:5432/${POSTGRES_DB:-schema_registry}
      API_KEY: ${API_KEY:-a-secure-test-api-key-12345}
      SEED_DIR: /app/seeds
    volumes:
      - ./seeds:/app/seeds:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_KEY: ${API_KEY:-a-secure-test-api-key-12345}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  postgres_data:
